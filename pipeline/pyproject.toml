[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gaia-pipeline"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "dagster>=1.9",
    "dagster-postgres",
    "dagster-webserver",
    "psycopg2-binary",
    "requests",
    "h3>=4.1",
    "numpy",
    "scipy",
    "anthropic",
    "redis",
]
