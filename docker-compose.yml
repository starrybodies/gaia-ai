version: '3.8'
services:
  gaia-db:
    image: timescale/timescaledb-ha:pg16-ts2.14
    environment:
      POSTGRES_DB: gaiaai
      POSTGRES_USER: gaia
      POSTGRES_PASSWORD: gaialocal
    ports:
      - "5432:5432"
    volumes:
      - gaia_pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gaia -d gaiaai"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  gaia_pgdata:
