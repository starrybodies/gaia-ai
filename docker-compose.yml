version: '3.8'
services:
  gaia-db:
    image: timescale/timescaledb-ha:pg16-ts2.14
    environment:
      POSTGRES_DB: gaiaai
      POSTGRES_USER: gaia
      POSTGRES_PASSWORD: gaialocal
    ports:
      - "5432:5432"
    volumes:
      - gaia_pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gaia -d gaiaai"]
      interval: 5s
      timeout: 5s
      retries: 10

  martin:
    image: ghcr.io/maplibre/martin:v0.13
    environment:
      DATABASE_URL: postgresql://gaia:gaialocal@gaia-db:5432/gaiaai
    ports:
      - "3002:3000"
    volumes:
      - ./martin/config.yaml:/config.yaml
    command: ["--config", "/config.yaml"]
    depends_on:
      gaia-db:
        condition: service_healthy

  titiler:
    image: ghcr.io/developmentseed/titiler:latest
    environment:
      PORT: "8008"
      WORKERS_PER_CORE: "1"
    ports:
      - "8008:8008"

volumes:
  gaia_pgdata:
